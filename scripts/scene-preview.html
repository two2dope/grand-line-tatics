<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <title>Grand Line Tactics — 3D Scene Preview Harness</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07101d;
    }
    #stage {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #wanted-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      border: 4px solid #2b1b11;
      z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- the sea sandbox: same order as SEA_FILES in scripts/build.js -->
  <script src="src/sea/_enter.js"></script>
  <script src="src/sea/consts.js"></script>
  <script src="src/sea/events.js"></script>
  <script src="src/sea/rng.js"></script>
  <script src="src/sea/layout.js"></script>
  <script src="src/sea/data.js"></script>
  <script src="src/sea/env.js"></script>
  <script src="src/render/clock.js"></script>
  <script src="src/render/palette.js"></script>
  <script src="src/render/voxel.js"></script>
  <script src="src/render/scene.js"></script>
  <script src="src/render/renderer.js"></script>
  <script src="src/render/camera.js"></script>
  <script src="src/render/lighting.js"></script>
  <script src="src/world/_kit.js"></script>
  <script src="src/world/ocean.js"></script>
  <script src="src/world/plates.js"></script>
  <script src="src/world/backdrop.js"></script>
  <script src="src/world/props.js"></script>
  <script src="src/world/crowd.js"></script>
  <script src="src/fx/particles.js"></script>
  <script src="src/fx/shots.js"></script>
  <script src="src/fx/ceremony.js"></script>
  <script src="src/fx/fireworks.js"></script>
  <script src="src/fx/weather.js"></script>
  <script src="src/sea/_exit.js"></script>
  <script src="src/ships/kit.js"></script>
  <script src="src/ships/flags.js"></script>
  <script src="src/ships/models.js"></script>
  <script src="src/ships/pilot-api.js"></script>
  <script src="src/pilot-render/backdrop-fx.js"></script>
  <script src="src/sea/bridge.js"></script>
  <script src="src/sea/fx-bridge.js"></script>
</head>
<body>
  <canvas id="stage"></canvas>
  <img id="wanted-overlay" alt="Cartaz de Procurado" />
  <script>
    (function () {
      const canvas = document.getElementById('stage');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();

      const platesSystem = GLT.platesLighting.createPlatesLightingSystem(renderer, scene, {
        boardSize: 10,
        cellSize: 2.0,
        aspect: window.innerWidth / window.innerHeight,
        pixelSize: 2,
        renderTargetHeight: Math.floor(window.innerHeight / 2)
      });

      const postPipeline = GLT.paletteShader.createPostPipeline(
        renderer,
        scene,
        platesSystem.camera,
        { pixelSize: 2, outlines: true, dither: true, paletteSnap: true }
      );

      const backdrop = GLT.backdropFx.createBackdropRing(scene, { radiusX: 52.0, radiusZ: 38.0, dollsHouseLift: true });
      const fx = GLT.backdropFx.createFxSystem(scene);

      // Place canonical fleet on Player Plate (0) and Enemy Plate (1)
      const placedShipGroups = [];
      const samplePlayerFleet = [
        { id: 'moby_dick', r: 1, c: 1, horizontal: true, length: 5, ownerColor: 0x0284c7 },
        { id: 'thousand_sunny', r: 3, c: 2, horizontal: false, length: 4, ownerColor: 0x0284c7 },
        { id: 'oro_jackson', r: 8, c: 4, horizontal: true, length: 4, ownerColor: 0x0284c7 },
        { id: 'red_force', r: 5, c: 6, horizontal: true, length: 3, ownerColor: 0x0284c7 },
        { id: 'polar_tang', r: 1, c: 8, horizontal: false, length: 3, ownerColor: 0x0284c7 },
        { id: 'baratie', r: 6, c: 0, horizontal: false, length: 3, ownerColor: 0x0284c7 },
        { id: 'going_merry', r: 0, c: 6, horizontal: true, length: 2, ownerColor: 0x0284c7 }
      ];

      const foamCellsP0 = [];
      samplePlayerFleet.forEach(s => {
        const mesh = GLT.shipsVoxel.createShipMesh(s.id, { cellSize: 2.0, ownerColor: s.ownerColor });
        const startPos = platesSystem.seaPlates.cellToWorld(0, s.r, s.c);
        const endR = s.horizontal ? s.r : s.r + s.length - 1;
        const endC = s.horizontal ? s.c + s.length - 1 : s.c;
        const endPos = platesSystem.seaPlates.cellToWorld(0, endR, endC);
        mesh.position.set((startPos.x + endPos.x) * 0.5, 0.15, (startPos.z + endPos.z) * 0.5);
        mesh.userData.basePosY = 0.15;
        if (!s.horizontal) {
          mesh.rotation.y = Math.PI * 0.5;
        }
        scene.add(mesh);
        placedShipGroups.push(mesh);
        for (let i = 0; i < s.length; i++) {
          foamCellsP0.push({ r: s.horizontal ? s.r : s.r + i, c: s.horizontal ? s.c + i : s.c });
        }
      });
      platesSystem.seaPlates.setShipFoamCells(0, foamCellsP0);

      // Add a ghost revealed sunk ship and shot markers on Enemy Plate (1)
      const ghostMerry = GLT.shipsVoxel.createGhostShipMesh('going_merry', { cellSize: 2.0, ownerColor: 0xdc2626 });
      const gmStart = platesSystem.seaPlates.cellToWorld(1, 2, 2);
      const gmEnd = platesSystem.seaPlates.cellToWorld(1, 2, 3);
      ghostMerry.position.set((gmStart.x + gmEnd.x) * 0.5, 0.15, gmStart.z);
      scene.add(ghostMerry);

      platesSystem.seaPlates.addShotMarker(1, 2, 2, 'sunk');
      platesSystem.seaPlates.addShotMarker(1, 2, 3, 'sunk');
      platesSystem.seaPlates.addShotMarker(1, 4, 4, 'hit');
      platesSystem.seaPlates.addShotMarker(1, 4, 5, 'hit');
      platesSystem.seaPlates.addShotMarker(1, 6, 3, 'water');
      platesSystem.seaPlates.addShotMarker(1, 1, 7, 'water');
      platesSystem.seaPlates.setSelection(1, 4, 6);
      platesSystem.seaPlates.setHover(1, 5, 5);

      backdrop.updateDenDenBoard({
        p1Shots: 14,
        p1Hits: 6,
        p1ShipsRemaining: 5,
        p2Shots: 13,
        p2Hits: 4,
        p2ShipsRemaining: 4,
        turnTimeRemaining: 24,
        lastShotCall: 'E5 — Acertou em cheio!'
      });

      let simTime = 2.5;
      function stepFrame(dt) {
        simTime += dt;
        platesSystem.update(dt, simTime, postPipeline.renderTarget.height);
        placedShipGroups.forEach(sg => GLT.shipsVoxel.updateShip(sg, dt, simTime));
        backdrop.update(platesSystem.camera, dt, simTime);
        fx.update(dt, simTime);
        postPipeline.render(simTime);
      }

      // Warm up 30 frames so lift & waves settle
      for (let i = 0; i < 30; i++) stepFrame(0.05);

      window.HARNESS = {
        platesSystem,
        postPipeline,
        backdrop,
        fx,
        placedShipGroups,
        stepFrame,
        setScenario: function (cfg) {
          const wantedImg = document.getElementById('wanted-overlay');
          wantedImg.style.display = 'none';
          if (cfg.env) platesSystem.setEnvironment(cfg.env, 0);
          if (cfg.camera) {
            platesSystem.setCameraPreset(cfg.camera, 0);
            backdrop.setCameraMode(cfg.camera);
          }
          if (typeof cfg.lift === 'boolean') {
            backdrop.setDollsHouseLiftEnabled(cfg.lift);
          }
          if (cfg.fireShot) {
            const pStart = platesSystem.seaPlates.cellToWorld(0, 3, 2);
            const pEnd = platesSystem.seaPlates.cellToWorld(1, 4, 5);
            fx.fireCannonball(pStart, pEnd, 'hit');
            fx.spawnHitExplosion(pEnd);
            fx.spawnWaterSplash(platesSystem.seaPlates.cellToWorld(1, 6, 3));
          }
          if (cfg.ceremony) {
            backdrop.setDollsHouseLiftEnabled(false);
            backdrop.setCeremonyActive(true, { winnerPlate: 0, crewId: 'straw_hats' });
            platesSystem.setCameraPreset('cerimonia', 0);
            const poster = GLT.backdropFx.generateWantedPoster(
              { name: 'MONKEY D. LUFFY', crewName: 'Chapéus de Palha', crewId: 'straw_hats' },
              1500000000
            );
            wantedImg.src = poster.dataUrl;
            wantedImg.style.display = 'block';
          }
          for (let i = 0; i < (cfg.steps || 25); i++) {
            stepFrame(0.05);
          }
        }
      };
    })();
  </script>
</body>
</html>
